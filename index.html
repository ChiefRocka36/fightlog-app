<script>
  window.storage = {
    get: function (key) {
      return new Promise(function (resolve, reject) {
        try {
          var v = localStorage.getItem("fl:" + key);
          if (v === null) { reject(new Error("not found")); return; }
          resolve({ key: key, value: v });
        } catch (e) { reject(e); }
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve, reject) {
        try { localStorage.setItem("fl:" + key, value); resolve({ key: key, value: value }); }
        catch (e) { reject(e); }
      });
    },
    delete: function (key) {
      return new Promise(function (resolve) { localStorage.removeItem("fl:" + key); resolve({ key: key, deleted: true }); });
    }
  };
  if ("serviceWorker" in navigator) {

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------- theme ---------- */

/* ---------- icons ---------- */

/* ---------- data model ---------- */
const DISCIPLINES = [
  { key: "mma", label: "MMA", strong: true },
  { key: "striking", label: "Striking", strong: true },
  { key: "boxing", label: "Boxing", strong: true },

const EVENT_TYPES = [

const SC_GOALS = [

];

  { key: "hg", label: "Home Gym" },

];
const SC_FAMILIARITY = [

  { key: "intermediate", label: "Intermediate" },
  { key: "advanced", label: "Advanced" }
];
const SC_SESSION_COUNTS = [2, 3, 4];
const SC_ENDURANCE_EQUIPMENT = [
  { key: "assault-bike", label: "Assault Bike" },
  { key: "running", label: "Running" },
  { key: "bike", label: "Bike" }
];

const FIGHT_CATEGORIES = [
  { key: "mma-pro", label: "MMA (Pro)", type: "mma" },
  { key: "mma-am", label: "MMA (Amateur)", type: "mma" },
  { key: "k1-pro", label: "K1 / Muay Thai (Pro)", type: "striking" },
  { key: "k1-am", label: "K1 / Muay Thai (Amateur)", type: "striking" },
  { key: "box-pro", label: "Boxing (Pro)", type: "striking" },
  { key: "box-am", label: "Boxing (Amateur)", type: "striking" },
  { key: "bjj-gi", label: "BJJ (Gi)", type: "bjj" },

];
const getFightCategory = (k) => FIGHT_CATEGORIES.find((c) => c.key === k) || FIGHT_CATEGORIES[0];
const FIGHT_METHODS = {
  mma: ["KO/TKO", "Submission", "Decision", "DQ"],
  striking: ["KO/TKO", "Decision", "DQ"],
  bjj: ["Submission", "Points", "Decision", "DQ"]
};
const RESULTS = ["W", "L", "D", "NC"];

/* exercise entry: { n: name, role: primary|secondary|core|hold|failure, uni: true → "/leg" suffix } */
const UPPER_EX = {
  fg: [{ n: "Bench Press", role: "primary" }, { n: "Barbell Row", role: "secondary" }, { n: "Lat Pulldown", role: "secondary" }, { n: "Military Press", role: "secondary" }, { n: "Palloff Press", role: "core" }],
  hg: [{ n: "DB Bench Press", role: "primary" }, { n: "DB Row", role: "secondary" }, { n: "DB Shoulder Press", role: "secondary" }, { n: "Band Face Pull", role: "secondary" }, { n: "Pallof Press (band)", role: "core" }],
  bw: [{ n: "Push-up", role: "primary" }, { n: "Inverted Row", role: "secondary" }, { n: "Pike Push-up", role: "secondary" }, { n: "Plank", role: "hold" }, { n: "Dead Bug", role: "core" }]
};
const LOWER_A_EX = {
  fg: [{ n: "Back Squat", role: "primary" }, { n: "Leg Curl Machine", role: "secondary" }, { n: "Barbell Hip Thrust", role: "secondary" }, { n: "Back Extension (weighted hold)", role: "hold" }],
  hg: [{ n: "Goblet Squat", role: "primary" }, { n: "DB Romanian Deadlift", role: "secondary" }, { n: "DB Hip Thrust", role: "secondary" }, { n: "Back Extension (bodyweight hold)", role: "hold" }],
  bw: [{ n: "Bodyweight Squat", role: "primary" }, { n: "Single-Leg RDL", role: "secondary", uni: true }, { n: "Glute Bridge", role: "secondary" }, { n: "Superman Hold", role: "hold" }]
};
const LOWER_B_EX = {
  fg: [{ n: "Deadlift", role: "primary" }, { n: "Front Squat", role: "secondary" }, { n: "Reverse Barbell Lunge", role: "secondary", uni: true }, { n: "Landmine Anti-Rotation", role: "core" }],
  hg: [{ n: "DB Romanian Deadlift", role: "primary" }, { n: "DB Front-Loaded Squat", role: "secondary" }, { n: "DB Reverse Lunge", role: "secondary", uni: true }, { n: "Pallof Press (band)", role: "core" }],
  bw: [{ n: "Single-Leg RDL", role: "primary", uni: true }, { n: "Bulgarian Split Squat", role: "secondary", uni: true }, { n: "Reverse Lunge", role: "secondary", uni: true }, { n: "Dead Bug", role: "core" }]
};
const FULL_EX = {
  fg: [{ n: "Back Squat", role: "primary" }, { n: "Bench Press", role: "secondary" }, { n: "Barbell Row", role: "secondary" }, { n: "Lat Pulldown", role: "secondary" }, { n: "Plank", role: "hold" }],
  hg: [{ n: "Goblet Squat", role: "primary" }, { n: "DB Bench Press", role: "secondary" }, { n: "DB Row", role: "secondary" }, { n: "Pallof Press (band)", role: "core" }, { n: "Glute Bridge", role: "secondary" }],
  bw: [{ n: "Bodyweight Squat", role: "primary" }, { n: "Push-up", role: "secondary" }, { n: "Glute Bridge", role: "secondary" }, { n: "Plank", role: "hold" }, { n: "Reverse Lunge", role: "secondary", uni: true }]
};
const POWER_UPPER_EX = {
  fg: [{ n: "Bench Press", role: "primary" }, { n: "Barbell Row", role: "secondary" }, { n: "Push Press", role: "secondary" }, { n: "Pull-up", role: "failure" }],
  hg: [{ n: "DB Bench Press", role: "primary" }, { n: "DB Row", role: "secondary" }, { n: "DB Push Press", role: "secondary" }, { n: "Inverted Row", role: "failure" }],
  bw: [{ n: "Clap Push-up", role: "primary" }, { n: "Explosive Inverted Row", role: "secondary" }, { n: "Pike Push-up", role: "secondary" }, { n: "Pull-up", role: "failure" }]
};
const POWER_UPPER_SUPERSET = {
  fg: ["Landmine Anti-Rotation", "Palloff Press"],
  hg: ["Pallof Press (band)", "Bird Dog"],
  bw: ["Bird Dog", "Dead Bug"]
};
const POWER_LOWER_EX = {
  fg: [{ n: "Power Clean", role: "explosive", sets: 5, reps: "2" }, { n: "Back Squat", role: "secondary", sets: 4, reps: "3" }, { n: "Deadlift", role: "secondary", sets: 3, reps: "3" }, { n: "Bulgarian Split Squat", role: "fixed", sets: 2, reps: "8", uni: true }],
  hg: [{ n: "Kettlebell Swing", role: "explosive", sets: 5, reps: "5" }, { n: "Goblet Squat", role: "secondary", sets: 4, reps: "6" }, { n: "DB Romanian Deadlift", role: "secondary", sets: 3, reps: "6" }, { n: "DB Bulgarian Split Squat", role: "fixed", sets: 2, reps: "8", uni: true }],
  bw: [{ n: "Broad Jump", role: "explosive", sets: 5, reps: "5" }, { n: "Jump Squat", role: "secondary", sets: 4, reps: "6" }, { n: "Single-Leg RDL", role: "secondary", sets: 3, reps: "8", uni: true }, { n: "Bulgarian Split Squat", role: "fixed", sets: 2, reps: "8", uni: true }]
};
const POWER_LOWER_HOLD = { fg: "Back Extension (weighted hold)", hg: "Back Extension (bodyweight hold)", bw: "Superman Hold" };
const PLYO_SPRINTS_EX = ["Broad Jump", "Box Jump", "Jump Squat", "Skater Jump", "Sprints (20–40m)"];

const SC_PRESCRIBE_TABLE = {
  "max-strength": { primary: [5, "4"], secondary: [3, "5"], core: [3, "10"], hold: [2, "30–45s"], failure: [3, "To failure"] },
  "hypertrophy": { primary: [3, "10"], secondary: [3, "10"], core: [3, "12"], hold: [3, "45s"], failure: [3, "To failure"] },
  "power": { primary: [4, "3"], secondary: [4, "3"], core: [2, "8"], hold: [2, "25s"], failure: [3, "To failure"] },
  "strength-endurance": { primary: [3, "15"], secondary: [3, "15"], core: [3, "15"], hold: [3, "35s"], failure: [3, "To failure"] }
};
function prescribe(goal, ex) {
  if (ex.sets && ex.reps !== undefined) return { sets: ex.sets, reps: ex.reps + (ex.uni ? "/leg" : "") };
  const [sets, baseReps] = SC_PRESCRIBE_TABLE[goal][ex.role] || [3, "10"];
  let reps = baseReps;
  if (ex.role !== "hold" && ex.role !== "failure") {
    if (ex.uni) reps = baseReps + "/leg";
    else if (ex.role === "core") reps = baseReps + "/side";
  }
  return { sets, reps };
}
function buildSession(goal, exList) { return exList.map((ex) => { const p = prescribe(goal, ex); return { name: ex.n, sets: p.sets, reps: p.reps }; }); }

function buildStrengthWeek(goal, sessionsPerWeek, equipment, familiarity) {
  const isPower = goal === "power";
  const days = [];
  if (isPower) {
    const upper = () => buildSession(goal, POWER_UPPER_EX[equipment]).concat(
      POWER_UPPER_SUPERSET[equipment].map((n) => ({ name: `${n} (superset)`, sets: 2, reps: "8/side" }))
    );
    const lower = () => {
      const list = POWER_LOWER_EX[equipment].map((ex) => ({ ...ex }));
      if (familiarity !== "advanced" && equipment === "fg") { list[0] = { n: "Kettlebell Swing", role: "explosive", sets: 5, reps: "8" }; }
      return buildSession(goal, list).concat([{ name: POWER_LOWER_HOLD[equipment], sets: 2, reps: "25–30s" }]);
    };
    const plyo = () => PLYO_SPRINTS_EX.map((n, i) => ({ name: n, sets: i < PLYO_SPRINTS_EX.length - 1 ? 4 : 6, reps: i < PLYO_SPRINTS_EX.length - 1 ? "5" : "30–40m" }));
    if (sessionsPerWeek === 2) days.push({ label: "Upper", exercises: upper() }, { label: "Lower", exercises: lower() });
    else if (sessionsPerWeek === 3) days.push({ label: "Upper", exercises: upper() }, { label: "Lower", exercises: lower() }, { label: "Plyo + Sprints", exercises: plyo() });
    else days.push({ label: "Upper A", exercises: upper() }, { label: "Lower A", exercises: lower() }, { label: "Upper B", exercises: upper() }, { label: "Lower B", exercises: lower() });
  } else {
    const upper = () => buildSession(goal, UPPER_EX[equipment]);
    const lowerA = () => buildSession(goal, LOWER_A_EX[equipment]);
    const lowerB = () => buildSession(goal, LOWER_B_EX[equipment]);
    const full = () => buildSession(goal, FULL_EX[equipment]);
    if (sessionsPerWeek === 2) days.push({ label: "Full Body A", exercises: full() }, { label: "Full Body B", exercises: full() });
    else if (sessionsPerWeek === 3) days.push({ label: "Upper", exercises: upper() }, { label: "Lower", exercises: lowerA() }, { label: "Full Body", exercises: full() });
    else days.push({ label: "Upper A", exercises: upper() }, { label: "Lower A", exercises: lowerA() }, { label: "Upper B", exercises: upper() }, { label: "Lower B", exercises: lowerB() });
  }
  const circuit = goal === "strength-endurance";
  return days.map((d) => ({ ...d, circuit }));
}

function buildEnduranceWeek(sessionsPerWeek, equipment, familiarity) {
  const modality = SC_ENDURANCE_EQUIPMENT.find((e) => e.key === equipment).label;
  const scale = familiarity === "beginner" ? 0.7 : familiarity === "advanced" ? 1.25 : 1;
  const kinds = sessionsPerWeek === 2 ? ["capacity", "threshold"]
    : sessionsPerWeek === 3 ? ["capacity", "threshold", "capacity"]
    : ["capacity", "threshold", "capacity", "threshold"];
  const seen = {};
  return kinds.map((kind) => {
    seen[kind] = (seen[kind] || 0) + 1;
    const n = seen[kind] > 1 ? ` ${seen[kind]}` : "";
    if (kind === "capacity") {
      const sets = Math.max(6, Math.round(10 * scale));
      return { label: `Anaerobic Capacity${n}`, exercises: [{ name: `${modality} Sprints`, sets, reps: "30s max effort / 90s easy" }], circuit: false };
    }
    const sets = Math.max(3, Math.round(5 * scale));
    return { label: `Anaerobic Threshold${n}`, exercises: [{ name: `${modality} Intervals`, sets, reps: "4 min hard-controlled / 2 min easy" }], circuit: false };
  });
}

/* ---------- dates ---------- */
const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => toISO(new Date());
const yesterdayISO = () => { const d = new Date(); d.setDate(d.getDate() - 1); return toISO(d); };
const fmtDayShort = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short" }).toUpperCase();
const fmtDateShort = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short" }).toUpperCase();
const fmtLong = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "long" });
function startOfWeekDate(d) { const day = (d.getDay() + 6) % 7; const s = new Date(d); s.setDate(d.getDate() - day); s.setHours(0, 0, 0, 0); return s; }
const startOfWeekISO = () => toISO(startOfWeekDate(new Date()));
function buildLastNWeeks(n) {
  const cur = startOfWeekDate(new Date()), out = [];
  for (let i = n - 1; i >= 0; i--) {
    const s = new Date(cur); s.setDate(cur.getDate() - i * 7);
    const e = new Date(s); e.setDate(s.getDate() + 6);
    out.push({ startISO: toISO(s), endISO: toISO(e), label: s.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit" }) });
  }
  return out;
}
function getMonthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startDay = (first.getDay() + 6) % 7;
  const inMonth = new Date(year, month + 1, 0).getDate();
  const inPrev = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) cells.push({ date: new Date(year, month - 1, inPrev - i), current: false });
  for (let d = 1; d <= inMonth; d++) cells.push({ date: new Date(year, month, d), current: true });
  while (cells.length % 7 !== 0) { const l = cells[cells.length - 1].date; const n = new Date(l); n.setDate(l.getDate() + 1); cells.push({ date: n, current: false }); }
  return cells;
}
const WEEKDAYS = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function findExerciseHistory(sessions, exerciseName) {
  const name = (exerciseName || "").trim().toLowerCase();
  if (!name) return null;
  let best = null;
  sessions.forEach((s) => {
    if (s.discipline !== "strength" || !s.exerciseLog) return;
    s.exerciseLog.forEach((ex) => {
      if (ex.name.trim().toLowerCase() === name && (!best || s.date > best.date)) best = { date: s.date, sets: ex.sets };
    });
  });
  return best;
}
function fmtSets(sets) {
  return sets.filter((s) => s.weight || s.reps).map((s) => `${s.weight || "–"}${s.weight ? "kg" : ""}×${s.reps || "–"}`).join(", ");
}

/* ---------- primitives ---------- */

    border: `1px solid ${T.rule}`, borderRadius: 0, padding: "13px 12px", fontSize: 15, outline: "none",
    colorScheme: T.bg === "#0e0d0c" ? "dark" : "light", ...style
  }} />;
}

  return <textarea {...rest} style={{
    width: "100%", boxSizing: "border-box", background: "transparent", color: T.fg,
    border: `1px solid ${T.rule}`, borderRadius: 0, padding: "11px 12px", fontSize: 15, outline: "none", resize: "none"
  }} />;
}
function Empty({ T, title, body }) {
  return (
    <div style={{ border: `1px solid ${T.rule}`, padding: "26px 18px" }}>
      <div style={{ font: "600 15px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{title}</div>
      <div style={{ fontSize: 13, lineHeight: 1.4, color: T.body, marginTop: 8, textWrap: "pretty" }}>{body}</div>
    </div>
  );
}

/* ---------- strength exercise log ---------- */
function SetInput({ T, value, onChange, placeholder }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      inputMode="decimal"
      className="fl-mono"
      style={{
        width: "100%", boxSizing: "border-box", background: "transparent", color: T.fg,
        border: `1px solid ${T.rule}`, borderRadius: 0, padding: "10px 8px", fontSize: 14, outline: "none", textAlign: "center"
      }}
    />
  );
}

function ExerciseLogEditor({ T, log, setLog, plans, sessions }) {
  const [manualName, setManualName] = useState("");

  const usePlan = (plan) => {
    setLog(plan.exercises.map((ex) => ({
      name: ex.name,
      target: `${ex.sets} × ${ex.reps}`,
      sets: Array.from({ length: Math.max(1, Number(ex.sets) || 1) }, () => ({ weight: "", reps: "" }))
    })));
  };
  const addExercise = () => {
    if (!manualName.trim()) return;
    setLog((l) => [...l, { name: manualName.trim(), target: "", sets: [{ weight: "", reps: "" }] }]);
    setManualName("");
  };
  const removeExercise = (i) => setLog((l) => l.filter((_, idx) => idx !== i));
  const addSet = (i) => setLog((l) => l.map((ex, idx) => (idx === i ? { ...ex, sets: [...ex.sets, { weight: "", reps: "" }] } : ex)));
  const removeSet = (i, si) => setLog((l) => l.map((ex, idx) => (idx === i ? { ...ex, sets: ex.sets.filter((_, sidx) => sidx !== si) } : ex)));
  const updateSet = (i, si, field, value) => setLog((l) => l.map((ex, idx) => (idx === i ? { ...ex, sets: ex.sets.map((s, sidx) => (sidx === si ? { ...s, [field]: value } : s)) } : ex)));

  return (
    <div>
      {plans.length > 0 && (
        <div>
          <Label T={T}>Use a saved plan</Label>
          <div className="fl-scroll-x" style={{ display: "flex", gap: 7, marginTop: 11 }}>
            {plans.map((p) => <Chip key={p.id} T={T} onClick={() => usePlan(p)}>{p.name}</Chip>)}
          </div>
        </div>
      )}

      <div style={{ marginTop: plans.length > 0 ? 18 : 0 }}>
        <Label T={T}>Add exercise</Label>
        <div style={{ display: "flex", gap: 7, marginTop: 11 }}>
          <div style={{ flex: 1 }}><Input T={T} placeholder="Exercise name" value={manualName} onChange={(e) => setManualName(e.target.value)} /></div>
          <button onClick={addExercise} style={{ width: 52, border: `1px solid ${T.fg}`, background: "transparent", color: T.fg, fontSize: 22, borderRadius: 0 }}>+</button>
        </div>
      </div>

      {log.map((ex, i) => (
        <div key={i} style={{ marginTop: 14, border: `1px solid ${T.rule}`, padding: 12 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
            <div>
              <div style={{ font: "600 14px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{ex.name}</div>
              {ex.target && <div className="fl-mono" style={{ fontSize: 10, color: T.muted, marginTop: 5 }}>TARGET {ex.target}</div>}
              {(() => {
                const hist = findExerciseHistory(sessions || [], ex.name);
                return hist && <div className="fl-mono" style={{ fontSize: 10, color: T.muted, marginTop: 5 }}>LAST TIME ({fmtDateShort(hist.date)}): {fmtSets(hist.sets)}</div>;
              })()}
            </div>
            <button onClick={() => removeExercise(i)} style={{ background: "none", border: "none", color: T.muted, padding: 2 }}><Icon name="x" size={16} /></button>
          </div>

          <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 7 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <div className="fl-mono" style={{ width: 20, fontSize: 9, color: T.muted }}>#</div>
              <div className="fl-mono" style={{ flex: 1, fontSize: 9, color: T.muted, textAlign: "center" }}>WEIGHT</div>
              <div className="fl-mono" style={{ flex: 1, fontSize: 9, color: T.muted, textAlign: "center" }}>REPS</div>
              <div style={{ width: 24 }} />
            </div>
            {ex.sets.map((s, si) => (
              <div key={si} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <div className="fl-mono" style={{ width: 20, fontSize: 12, color: T.muted }}>{si + 1}</div>
                <div style={{ flex: 1 }}><SetInput T={T} value={s.weight} onChange={(v) => updateSet(i, si, "weight", v)} placeholder="kg" /></div>
                <div style={{ flex: 1 }}><SetInput T={T} value={s.reps} onChange={(v) => updateSet(i, si, "reps", v)} placeholder="reps" /></div>
                <button onClick={() => removeSet(i, si)} style={{ width: 24, height: 24, background: "none", border: "none", color: T.muted }}>×</button>
              </div>
            ))}
          </div>
          <button onClick={() => addSet(i)} className="fl-mono" style={{
            width: "100%", marginTop: 10, border: `1px dashed ${T.rule}`, background: "transparent", color: T.muted,
            height: 36, fontSize: 10, letterSpacing: "0.1em", borderRadius: 0, textTransform: "uppercase"
          }}>+ Add set</button>
        </div>
      ))}
    </div>
  );
}

/* ---------- endurance log ---------- */
const ENDURANCE_TYPES = ["Intervals", "Steady Run", "Tempo Run", "Long Run", "Assault Bike", "Rower", "Bike", "Swim", "Other"];
function EnduranceLogEditor({ T, value, onChange }) {
  return (
    <div>
      <Label T={T}>Type</Label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 11 }}>
        {ENDURANCE_TYPES.map((t) => <Chip key={t} T={T} active={value.type === t} onClick={() => onChange({ ...value, type: t })}>{t}</Chip>)}
      </div>
      <div style={{ display: "flex", gap: 7, marginTop: 18 }}>
        <div style={{ flex: 1 }}><Label T={T}>Distance (m)</Label>
          <div style={{ marginTop: 8 }}><Input T={T} type="number" placeholder="0" value={value.distanceM} onChange={(e) => onChange({ ...value, distanceM: e.target.value })} /></div></div>

      <div style={{ marginTop: 18 }}><Label T={T}>Notes</Label>

/* ---------- session form ---------- */
function SessionForm({ T, onSave, onCancel, last, plans, sessions }) {
  const [discipline, setDiscipline] = useState(last ? last.discipline : "mma");
  const [date, setDate] = useState(todayISO());
  const [duration, setDuration] = useState(last && last.duration ? last.duration : 90);
  const [notes, setNotes] = useState("");
  const [didWell, setDidWell] = useState("");
  const [toImprove, setToImprove] = useState("");
  const [exerciseLog, setExerciseLog] = useState([]);
  const [endurance, setEndurance] = useState({ type: "", distanceM: "", notes: "" });
  const isStrength = discipline === "strength";
  const isEndurance = discipline === "conditioning";
  const step = (n) => setDuration((d) => Math.max(0, (Number(d) || 0) + n));
  const submit = () => onSave({
    id: uid(), discipline, date, duration: Number(duration) || 0,
    notes: isEndurance ? endurance.notes.trim() : notes.trim(),
    didWell: didWell.trim(), toImprove: toImprove.trim(),
    exerciseLog: isStrength ? exerciseLog : [],
    enduranceType: isEndurance ? endurance.type : "",
    enduranceDistance: isEndurance && endurance.distanceM ? Number(endurance.distanceM) : null,
    createdAt: Date.now()
  });
  const repeat = () => { if (!last) return; setDiscipline(last.discipline); if (last.duration) setDuration(last.duration); };
  return (
    <div style={{ borderTop: `2px solid ${T.fg}`, marginTop: 4 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", padding: "16px 0 0" }}>
        <div style={{ font: "700 22px/1 Archivo, sans-serif", letterSpacing: "-0.02em", textTransform: "uppercase", color: T.fg }}>New session</div>
        <button onClick={onCancel} style={{ background: "none", border: "none", color: T.muted, padding: 6 }}><Icon name="x" size={20} /></button>
      </div>

      {last && (
        <button onClick={repeat} className="fl-mono" style={{
          width: "100%", marginTop: 14, border: `1px dashed ${T.rule}`, background: "transparent", color: T.muted,
          height: 44, fontSize: 11, letterSpacing: "0.12em", borderRadius: 0, textTransform: "uppercase"
        }}>↻ Repeat: {getDiscipline(last.discipline).label}{last.duration ? ` ${last.duration}′` : ""}</button>
      )}

      <div style={{ marginTop: 18 }}><Label T={T}>Discipline</Label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 11 }}>
          {DISCIPLINES.map((d) => <Chip key={d.key} T={T} active={discipline === d.key} onClick={() => setDiscipline(d.key)}>{d.label}</Chip>)}
        </div>
      </div>

      <div style={{ marginTop: 18 }}><Label T={T}>Date</Label>
        <div style={{ display: "flex", gap: 7, marginTop: 11 }}>
          <SmallChip T={T} active={date === todayISO()} onClick={() => setDate(todayISO())}>TODAY</SmallChip>
          <SmallChip T={T} active={date === yesterdayISO()} onClick={() => setDate(yesterdayISO())}>YESTERDAY</SmallChip>
          <div style={{ flex: 1.4 }}><Input T={T} type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ padding: "9px 10px", fontSize: 13 }} /></div>
        </div>
      </div>

      <div style={{ marginTop: 18 }}><Label T={T}>Duration</Label>
        <div style={{ display: "flex", gap: 7, marginTop: 11 }}>
          <button onClick={() => step(-15)} style={{ width: 56, border: `1px solid ${T.fg}`, background: "transparent", color: T.fg, fontSize: 24, borderRadius: 0 }}>–</button>
          <div style={{ flex: 1, border: `1px solid ${T.fg}`, display: "flex", alignItems: "baseline", justifyContent: "center", gap: 6, padding: "14px 0" }}>
            <span className="fl-mono" style={{ fontSize: 30, fontWeight: 600, color: T.fg }}>{duration}</span>
            <span className="fl-mono" style={{ fontSize: 11, color: T.muted }}>MIN</span>
          </div>
          <button onClick={() => step(15)} style={{ width: 56, border: `1px solid ${T.fg}`, background: "transparent", color: T.fg, fontSize: 24, borderRadius: 0 }}>+</button>
        </div>
        <div style={{ display: "flex", gap: 7, marginTop: 7 }}>
          {[45, 60, 90, 120].map((d) => <SmallChip key={d} T={T} active={Number(duration) === d} onClick={() => setDuration(d)}>{d} MIN</SmallChip>)}
        </div>
      </div>

      {isStrength ? (
        <div style={{ marginTop: 18 }}>
          <ExerciseLogEditor T={T} log={exerciseLog} setLog={setExerciseLog} plans={(plans || []).filter((p) => p.goal !== "endurance")} sessions={sessions || []} />
        </div>
      ) : isEndurance ? (
        <div style={{ marginTop: 18 }}>
          <EnduranceLogEditor T={T} value={endurance} onChange={setEndurance} />
        </div>
      ) : (
        <div style={{ marginTop: 18, display: "flex", flexDirection: "column", gap: 12 }}>
          <div><Label T={T}>What you drilled</Label>
            <div style={{ marginTop: 8 }}><Area T={T} rows={4} placeholder="Underhook chains, snap downs, 5 live goes" value={notes} onChange={(e) => setNotes(e.target.value)} /></div></div>
          <div><Label T={T}>Went well</Label>
            <div style={{ marginTop: 8 }}><Area T={T} rows={4} placeholder="What worked?" value={didWell} onChange={(e) => setDidWell(e.target.value)} /></div></div>
          <div><Label T={T}>Fix next time</Label>
            <div style={{ marginTop: 8 }}><Area T={T} rows={4} placeholder="What needs work?" value={toImprove} onChange={(e) => setToImprove(e.target.value)} /></div></div>
        </div>
      )}

      <div style={{ marginTop: 18 }}><Primary T={T} onClick={submit}>Save session</Primary></div>
    </div>
  );
}

/* ---------- log ---------- */
function SessionRow({ T, session, onDelete }) {
  const [open, setOpen] = useState(false);
  const disc = getDiscipline(session.discipline);
  return (
    <div style={{ borderBottom: `1px solid ${T.rule}` }}>
      <button onClick={() => setOpen((o) => !o)} style={{ display: "flex", width: "100%", background: "transparent", border: "none", padding: 0, textAlign: "left" }}>
        <div style={{ width: 62, flex: "none", padding: "14px 0", borderRight: `1px solid ${T.rule}` }}>
          <div className="fl-mono" style={{ fontSize: 12, fontWeight: 600, color: T.fg }}>{fmtDayShort(session.date)}</div>
          <div className="fl-mono" style={{ fontSize: 10, color: T.muted, marginTop: 6 }}>{fmtDateShort(session.date)}</div>
        </div>
        <div style={{ flex: 1, minWidth: 0, padding: "14px 0 14px 14px" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 8 }}>
            <div style={{ font: "600 15px/1 Archivo, sans-serif", textTransform: "uppercase", color: disc.strong ? T.fg : T.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{disc.label}</div>
            {!!session.duration && <div className="fl-mono" style={{ flex: "none", fontSize: 13, fontWeight: 600, color: T.fg, whiteSpace: "nowrap" }}>{session.duration}′</div>}
          </div>
          {!open && session.exerciseLog && session.exerciseLog.length > 0 && (
            <div style={{ fontSize: 12, lineHeight: 1.35, color: T.body, marginTop: 7, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {session.exerciseLog.map((e) => e.name).join(", ")}
            </div>
          )}
          {!open && !(session.exerciseLog && session.exerciseLog.length > 0) && session.enduranceType && (
            <div style={{ fontSize: 12, lineHeight: 1.35, color: T.body, marginTop: 7, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {session.enduranceType}{session.enduranceDistance != null ? ` · ${session.enduranceDistance}m` : ""}
            </div>
          )}
          {!open && !(session.exerciseLog && session.exerciseLog.length > 0) && !session.enduranceType && (session.notes || session.didWell) && (
            <div style={{ fontSize: 12, lineHeight: 1.35, color: T.body, marginTop: 7, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {session.notes || session.didWell}
            </div>
          )}
        </div>
      </button>
      {open && (
        <div style={{ padding: "0 0 16px 76px", display: "flex", flexDirection: "column", gap: 12 }}>
          {session.exerciseLog && session.exerciseLog.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {session.exerciseLog.map((ex, i) => (
                <div key={i}>
                  <div style={{ font: "600 13px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{ex.name}</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6 }}>
                    {ex.sets.filter((s) => s.weight || s.reps).map((s, si) => (
                      <span key={si} className="fl-mono" style={{ fontSize: 11, color: T.body, border: `1px solid ${T.rule}`, padding: "5px 8px" }}>
                        {s.weight || "–"}{s.weight ? "kg" : ""} × {s.reps || "–"}
                      </span>
                    ))}
                    {ex.sets.every((s) => !s.weight && !s.reps) && <span style={{ fontSize: 12, color: T.muted }}>No sets logged</span>}
                  </div>
                </div>
              ))}
            </div>
          )}
          {session.enduranceType && (
            <div>
              <div style={{ font: "600 13px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{session.enduranceType}</div>
              {session.enduranceDistance != null && <div className="fl-mono" style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>{session.enduranceDistance}m</div>}
            </div>
          )}
          {[[session.enduranceType ? "Notes" : "What you drilled", session.notes], ["Went well", session.didWell], ["Fix next time", session.toImprove]]
            .filter(([, v]) => v).map(([l, v]) => (
              <div key={l}><Label T={T}>{l}</Label>
                <div style={{ fontSize: 14, lineHeight: 1.4, color: T.fg, marginTop: 6, textWrap: "pretty" }}>{v}</div></div>
            ))}
          <button onClick={() => onDelete(session.id)} className="fl-mono" style={{
            alignSelf: "flex-start", background: "transparent", border: `1px solid ${T.rule}`, color: T.muted,
            borderRadius: 0, padding: "10px 12px", fontSize: 10, letterSpacing: "0.12em", display: "flex", alignItems: "center", gap: 8
          }}><Icon name="trash" size={14} /> DELETE</button>
        </div>
      )}
    </div>
  );
}

function LogView({ T, sessions, addSession, deleteSession, plans }) {
  const [showForm, setShowForm] = useState(false);
  const [filter, setFilter] = useState("all");
  const sorted = useMemo(() => [...sessions].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt)), [sessions]);
  const filtered = filter === "all" ? sorted : sorted.filter((s) => s.discipline === filter);
  const stats = useMemo(() => {
    const ws = startOfWeekISO();
    const counts = {};
    sessions.forEach((s) => (counts[s.discipline] = (counts[s.discipline] || 0) + 1));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return { total: sessions.length, week: sessions.filter((s) => s.date >= ws).length, top: top ? getDiscipline(top[0]).label : "–" };
  }, [sessions]);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", borderBottom: `1px solid ${T.rule}` }}>
        {[{ v: stats.total, l: "SESSIONS" }, { v: stats.week, l: "THIS WEEK" }, { v: stats.top, l: "MOST LOGGED", txt: true }].map((s, i) => (
          <div key={s.l} style={{ padding: "16px 14px", borderLeft: i > 0 ? `1px solid ${T.rule}` : "none" }}>
            {s.txt
              ? <div style={{ font: "600 17px/0.9 Archivo, sans-serif", textTransform: "uppercase", color: T.fg, paddingTop: 12 }}>{s.v}</div>
              : <div className="fl-mono" style={{ fontSize: 34, lineHeight: 0.85, fontWeight: 600, color: T.fg }}>{s.v}</div>}
            <div className="fl-mono" style={{ fontSize: 9, letterSpacing: "0.16em", color: T.muted, marginTop: 9 }}>{s.l}</div>
          </div>
        ))}
      </div>

      {!showForm && (
        <div style={{ padding: "14px 0 12px" }}>
          <Primary T={T} onClick={() => setShowForm(true)}><span style={{ fontSize: 19, lineHeight: 1 }}>+</span> Log session</Primary>
        </div>
      )}
      {showForm && (
        <SessionForm T={T} last={sorted[0]} plans={plans} sessions={sessions} onCancel={() => setShowForm(false)}
          onSave={(s) => { addSession(s); setShowForm(false); }} />
      )}

      {!showForm && (
        <div className="fl-scroll-x" style={{ display: "flex", gap: 6, paddingBottom: 14 }}>
          <Chip T={T} active={filter === "all"} onClick={() => setFilter("all")}>All</Chip>
          {DISCIPLINES.map((d) => <Chip key={d.key} T={T} active={filter === d.key} onClick={() => setFilter(d.key)}>{d.label}</Chip>)}
        </div>
      )}

      {!showForm && (filtered.length === 0
        ? <Empty T={T} title="No sessions yet" body="Log the session you just finished — discipline, minutes, RPE. Notes are optional." />
        : <div style={{ borderTop: `1px solid ${T.rule}` }}>
            {filtered.map((s) => <SessionRow key={s.id} T={T} session={s} onDelete={deleteSession} />)}
          </div>)}
    </div>
  );
}

    </div>
  );

/* ---------- charts ---------- */
function LineChart({ T, points, height = 90 }) {
  const w = 300, pad = 10;
  const vals = points.map((p) => p.y);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const stepX = points.length > 1 ? (w - pad * 2) / (points.length - 1) : 0;
  const coords = points.map((p, i) => ({ x: pad + i * stepX, y: pad + (1 - (p.y - min) / range) * (height - pad * 2) }));
  const path = coords.map((c, i) => `${i === 0 ? "M" : "L"}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ width: "100%", height: "auto", display: "block", overflow: "visible" }}>
      <path d={path} fill="none" stroke={T.fg} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {coords.map((c, i) => <circle key={i} cx={c.x} cy={c.y} r={i === coords.length - 1 ? 4 : 2.5} fill={T.bg} stroke={T.fg} strokeWidth="1.6" />)}
      <text x={coords[coords.length - 1].x} y={coords[coords.length - 1].y - 10} textAnchor="end" fontFamily="'IBM Plex Mono', monospace" fontSize="11" fontWeight="600" fill={T.fg}>
        {points[points.length - 1].y}
      </text>
    </svg>
  );
}
function Sparkline({ T, points, width = 56, height = 22 }) {
  const vals = points.map((p) => p.y);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const stepX = points.length > 1 ? width / (points.length - 1) : 0;
  const path = points.map((p, i) => {
    const x = i * stepX, y = (1 - (p.y - min) / range) * height;
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: "block" }}>
      <path d={path} fill="none" stroke={T.muted} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

          <span className="fl-mono" style={{ fontSize: 12, color: T.fg }}>{grouped.length} tracked</span>
          <span style={{ fontSize: 16, color: T.muted, transform: open ? "rotate(45deg)" : "none", transition: "transform .2s" }}>+</span>
        </div>
      </button>
      {open && (
        <div style={{ padding: "0 14px 16px" }}>
          {grouped.length === 0
            ? <Empty T={T} title="No PRs yet" body="Log your current best lifts." />
            : grouped.map(([exercise, entries]) => <PRGroupCard key={exercise} T={T} exercise={exercise} entries={entries} deletePR={deletePR} />)}
          {showForm
            ? <PRForm T={T} onCancel={() => setShowForm(false)} onSave={(p) => { addPR(p); setShowForm(false); }} />
            : <div style={{ marginTop: 12 }}><Primary T={T} onClick={() => setShowForm(true)}><Icon name="plus" size={15} /> Add PR</Primary></div>}
        </div>
      )}

}

/* ---------- bodyweight ---------- */
function BodyweightForm({ T, onSave, onCancel }) {
  const [weight, setWeight] = useState("");
  const [date, setDate] = useState(todayISO());
  const submit = () => {
    const w = parseFloat(weight);
    if (!w) return;
    onSave({ id: uid(), weight: w, date, createdAt: Date.now() });
  };
  return (
    <div style={{ borderTop: `2px solid ${T.fg}`, paddingTop: 14, marginTop: 14 }}>
      <Label T={T}>Weight (kg)</Label>
      <div style={{ marginTop: 8 }}><Input T={T} type="number" step="0.1" placeholder="0" value={weight} onChange={(e) => setWeight(e.target.value)} /></div>
      <div style={{ marginTop: 12 }}><Label T={T}>Date</Label>
        <div style={{ marginTop: 8 }}><Input T={T} type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div style={{ display: "flex", gap: 7, marginTop: 14 }}>
        <Ghost T={T} onClick={onCancel}>Cancel</Ghost>
        <div style={{ flex: 1 }}><Primary T={T} onClick={submit}>Save</Primary></div>
      </div>
    </div>
  );
}

function BodyweightSection({ T, bodyweight, addBodyweight, deleteBodyweight }) {
  const [open, setOpen] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const sorted = useMemo(() => bodyweight.slice().sort((a, b) => a.date.localeCompare(b.date)), [bodyweight]);
  const window8 = sorted.slice(-8);
  const latest = sorted[sorted.length - 1];
  const windowStart = window8[0];
  const delta = latest && windowStart && windowStart.id !== latest.id ? +(latest.weight - windowStart.weight).toFixed(1) : null;

  return (
    <div style={{ border: `1px solid ${T.rule}` }}>
      <button onClick={() => setOpen((o) => !o)} style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "space-between", background: "transparent", border: "none", padding: 14, textAlign: "left" }}>
        <div>
          <div className="fl-mono" style={{ fontSize: 9, letterSpacing: "0.14em", color: T.muted, textTransform: "uppercase" }}>Bodyweight</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 6 }}>
            {latest ? (
              <>
                <span className="fl-mono" style={{ fontSize: 19, fontWeight: 600, color: T.fg }}>{latest.weight}kg</span>
                {delta !== null && <span className="fl-mono" style={{ fontSize: 10, fontWeight: 600, padding: "2px 5px", background: delta <= 0 ? T.winBg : T.lossBg, color: delta <= 0 ? T.win : T.loss }}>{delta > 0 ? "+" : ""}{delta}kg since {fmtDateShort(windowStart.date)}</span>}
              </>
            ) : <span className="fl-mono" style={{ fontSize: 13, color: T.muted }}>No entries yet</span>}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {window8.length > 1 && <Sparkline T={T} points={window8.map((e) => ({ x: e.date, y: e.weight }))} />}
          <span style={{ fontSize: 16, color: T.muted, transform: open ? "rotate(45deg)" : "none", transition: "transform .2s" }}>+</span>
        </div>
      </button>
      {open && (
        <div style={{ padding: "0 14px 16px" }}>
          {window8.length > 1 && (
            <div>
              <LineChart T={T} points={window8.map((e) => ({ x: e.date, y: e.weight }))} height={90} />
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
                <span className="fl-mono" style={{ fontSize: 8.5, color: T.muted }}>{fmtDateShort(window8[0].date)}</span>
                <span className="fl-mono" style={{ fontSize: 8.5, color: T.muted }}>{fmtDateShort(window8[window8.length - 1].date)}</span>
              </div>
            </div>
          )}
          {sorted.length === 0 && <Empty T={T} title="No bodyweight logged yet" body="Track your weight to see trends over time." />}
          {showForm
            ? <BodyweightForm T={T} onCancel={() => setShowForm(false)} onSave={(e) => { addBodyweight(e); setShowForm(false); }} />
            : <div style={{ marginTop: 12 }}><Primary T={T} onClick={() => setShowForm(true)}><Icon name="plus" size={15} /> Log weight</Primary></div>}
          {sorted.length > 0 && (
            <div style={{ marginTop: 14 }}>
              {sorted.slice().reverse().slice(0, 10).map((e) => (
                <div key={e.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderTop: `1px solid ${T.rule}` }}>
                  <span className="fl-mono" style={{ fontSize: 10.5, color: T.muted }}>{fmtDateShort(e.date)}</span>
                  <span style={{ fontSize: 13, color: T.fg }}>{e.weight}kg</span>
                  <button onClick={() => deleteBodyweight(e.id)} style={{ background: "none", border: "none", color: T.muted, padding: 2 }}><Icon name="trash" size={13} /></button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- fight record ---------- */
function ResultBadge({ T, result }) {
  const map = { W: [T.winBg, T.win], L: [T.lossBg, T.loss], D: [T.drawBg, T.draw], NC: [T.drawBg, T.draw] };
  const [bg, fg] = map[result] || map.D;
  return <div className="fl-mono" style={{ width: 24, height: 24, flex: "none", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 600, background: bg, color: fg }}>{result}</div>;
}

function FightResultForm({ T, category, onSave, onCancel }) {
  const cat = getFightCategory(category);
  const methods = FIGHT_METHODS[cat.type];
  const [result, setResult] = useState(null);
  const [method, setMethod] = useState(null);
  const [opponent, setOpponent] = useState("");
  const [date, setDate] = useState(todayISO());
  const [notes, setNotes] = useState("");
  const [error, setError] = useState(false);
  const submit = () => {
    if (!result || !method) { setError(true); return; }
    onSave({ id: uid(), category, result, method, opponent: opponent.trim(), notes: notes.trim(), date, createdAt: Date.now() });
  };
  return (
    <div style={{ borderTop: `2px solid ${T.fg}`, paddingTop: 14, marginTop: 12 }}>
      <Label T={T}>Result</Label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 11 }}>
        {RESULTS.map((r) => {
          const active = result === r;
          const color = r === "W" ? T.win : r === "L" ? T.loss : T.draw;
          return (
            <button key={r} onClick={() => { setResult(r); setError(false); }} style={{
              border: `1px solid ${active ? color : T.fg}`, background: active ? color : "transparent", color: active ? "#fff" : T.fg,
              font: "600 12px/1 Archivo, sans-serif", letterSpacing: "0.06em", textTransform: "uppercase", padding: "13px 12px", borderRadius: 0
            }}>{r}</button>
          );
        })}
      </div>
      <div style={{ marginTop: 14 }}><Label T={T}>Method</Label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 11 }}>
          {methods.map((m) => <Chip key={m} T={T} active={method === m} onClick={() => { setMethod(m); setError(false); }}>{m}</Chip>)}
        </div>
      </div>
      {error && <div style={{ fontSize: 12, color: T.loss, marginTop: 10 }}>Pick a result and a method.</div>}
      <div style={{ marginTop: 14 }}><Label T={T}>Opponent (optional)</Label>
        <div style={{ marginTop: 8 }}><Input T={T} placeholder="Name" value={opponent} onChange={(e) => setOpponent(e.target.value)} /></div></div>
      <div style={{ marginTop: 12 }}><Label T={T}>Date</Label>
        <div style={{ marginTop: 8 }}><Input T={T} type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div></div>
      <div style={{ marginTop: 12 }}><Label T={T}>Notes (optional)</Label>
        <div style={{ marginTop: 8 }}><Area T={T} rows={2} placeholder="Event, details …" value={notes} onChange={(e) => setNotes(e.target.value)} /></div></div>
      <div style={{ display: "flex", gap: 7, marginTop: 14 }}>
        <Ghost T={T} onClick={onCancel}>Cancel</Ghost>
        <div style={{ flex: 1 }}><Primary T={T} onClick={submit}>Save result</Primary></div>
      </div>
    </div>
  );
}

function FightCategoryCard({ T, category, fights, addFlow, setAddFlow, deleteFight, addFight }) {
  const [manualOpen, setManualOpen] = useState(false);
  const cat = getFightCategory(category);
  const w = fights.filter((f) => f.result === "W").length;
  const l = fights.filter((f) => f.result === "L").length;
  const d = fights.filter((f) => f.result === "D" || f.result === "NC").length;
  const methodCounts = {};
  fights.forEach((f) => { if (f.result === "W") methodCounts[f.method] = (methodCounts[f.method] || 0) + 1; });
  const methodLabel = Object.entries(methodCounts).map(([m, c]) => `${m} × ${c}`).join(" · ");
  const sorted = useMemo(() => fights.slice().sort((a, b) => b.date.localeCompare(a.date)), [fights]);

  const active = addFlow && addFlow.category === category;
  const open = manualOpen || active;

  return (
    <div style={{ border: `1px solid ${T.rule}`, marginTop: 10 }}>
      <button onClick={() => setManualOpen((o) => !o)} style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "space-between", background: "transparent", border: "none", padding: 14, textAlign: "left" }}>
        <div>
          <div style={{ font: "600 13.5px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{cat.label}</div>
          <div className="fl-mono" style={{ fontSize: 9, color: T.muted, marginTop: 5, letterSpacing: "0.08em" }}>{methodLabel || "NO WINS YET"}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span className="fl-mono" style={{ fontSize: 16, fontWeight: 600, color: T.fg, whiteSpace: "nowrap" }}>{w}-{l}-{d}</span>
          <span style={{ fontSize: 16, color: T.muted, transform: open ? "rotate(45deg)" : "none", transition: "transform .2s" }}>+</span>
        </div>
      </button>
      {open && (
        <div style={{ padding: "0 14px 16px" }}>
          {sorted.map((f) => (
            <div key={f.id} style={{ display: "flex", gap: 12, padding: "11px 0", borderTop: `1px solid ${T.rule}` }}>
              <ResultBadge T={T} result={f.result} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ font: "600 13.5px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{f.method}</div>
                <div className="fl-mono" style={{ fontSize: 10.5, color: T.muted, marginTop: 4 }}>{[fmtDateShort(f.date), f.opponent].filter(Boolean).join(" · ")}</div>
                {f.notes && <div style={{ fontSize: 12.5, color: T.body, marginTop: 5, lineHeight: 1.35 }}>{f.notes}</div>}
              </div>
              <button onClick={() => deleteFight(f.id)} style={{ background: "none", border: "none", color: T.muted, padding: 4 }}><Icon name="trash" size={14} /></button>
            </div>
          ))}
          {!active && (
            <Ghost T={T} onClick={() => setAddFlow({ category })}><Icon name="plus" size={13} /> Add result</Ghost>
          )}
          {active && (
            <FightResultForm T={T} category={category} onCancel={() => setAddFlow(null)}
              onSave={(f) => { addFight(f); setAddFlow(null); }} />
          )}
        </div>
      )}
    </div>
  );
}

function FightRecordSection({ T, fights, addFight, deleteFight }) {
  const [addFlow, setAddFlow] = useState(null); // null | { category } | { picking: true }
  const populated = FIGHT_CATEGORIES.filter((c) => fights.some((f) => f.category === c.key));
  const pickingNew = addFlow && addFlow.picking;
  const newCategoryActive = addFlow && addFlow.category && !populated.some((c) => c.key === addFlow.category);

  return (
    <div>
      <Label T={T}>Fight Record</Label>
      <div style={{ marginTop: 8 }}>
        {populated.length === 0
          ? <Empty T={T} title="No fights logged yet" body="Add your first result using the button below." />
          : populated.map((c) => (
              <FightCategoryCard key={c.key} T={T} category={c.key} fights={fights.filter((f) => f.category === c.key)}
                addFlow={addFlow} setAddFlow={setAddFlow} addFight={addFight} deleteFight={deleteFight} />
            ))}
      </div>

      {pickingNew && (
        <div style={{ borderTop: `2px solid ${T.fg}`, paddingTop: 14, marginTop: 12 }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
            <Label T={T}>Which discipline?</Label>
            <button onClick={() => setAddFlow(null)} style={{ background: "none", border: "none", color: T.muted, padding: 2 }}><Icon name="x" size={16} /></button>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 11 }}>
            {FIGHT_CATEGORIES.map((c) => <Chip key={c.key} T={T} onClick={() => setAddFlow({ category: c.key })}>{c.label}</Chip>)}
          </div>
        </div>
      )}

      {newCategoryActive && (
        <FightResultForm T={T} category={addFlow.category} onCancel={() => setAddFlow(null)}
          onSave={(f) => { addFight(f); setAddFlow(null); }} />
      )}

      {!addFlow && (
        <div style={{ marginTop: 12 }}><Primary T={T} onClick={() => setAddFlow({ picking: true })}><Icon name="plus" size={15} /> Add result</Primary></div>
      )}
    </div>
  );
}

/* ---------- stats ---------- */
function StatsView({ T, sessions, events, plans, prs, addPR, deletePR, fights, addFight, deleteFight, bodyweight, addBodyweight, deleteBodyweight, onImport }) {
  const weeks = useMemo(() => buildLastNWeeks(8).map((w) => ({
    ...w, minutes: sessions.filter((s) => s.date >= w.startISO && s.date <= w.endISO).reduce((sum, s) => sum + (Number(s.duration) || 0), 0)
  })), [sessions]);
  const max = Math.max(...weeks.map((w) => w.minutes), 1);
  const total = weeks.reduce((s, w) => s + w.minutes, 0);
  const avg = Math.round(total / 8);
  const rows = DISCIPLINES.map((d) => ({ ...d, count: sessions.filter((s) => s.discipline === d.key).length }))
    .filter((d) => d.count > 0).sort((a, b) => b.count - a.count);

  const [pending, setPending] = useState(null);
  const [error, setError] = useState("");
  const doExport = () => {
    const payload = { app: "fight-log", version: 1, exportedAt: new Date().toISOString(), sessions, events, plans, prs, fights, bodyweight };
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = `fight-log-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const onFile = (e) => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    setError("");
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || typeof d !== "object") throw 0; setPending(d); } catch (err) { setError("Could not read that file. Is it a Fight Log backup?"); } };
    r.readAsText(file);
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
        <div className="fl-mono" style={{ fontSize: 40, lineHeight: 0.85, fontWeight: 600, color: T.fg }}>{total}</div>
        <div className="fl-mono" style={{ fontSize: 10, letterSpacing: "0.14em", color: T.muted }}>MINUTES · Ø {avg} / WK</div>
      </div>

      <div style={{ paddingBottom: 18, marginTop: 18, borderBottom: `1px solid ${T.rule}` }}>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 140 }}>
          {weeks.map((w, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", gap: 7 }}>
              <span className="fl-mono" style={{ fontSize: 9, color: T.muted }}>{w.minutes || ""}</span>
              <div style={{ width: "100%", height: Math.max(3, Math.round((w.minutes / max) * 110)), background: w.minutes === max && max > 0 ? T.fg : T.muted }} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          {weeks.map((w, i) => <div key={i} className="fl-mono" style={{ flex: 1, textAlign: "center", fontSize: 8, color: T.muted }}>{w.label}</div>)}
        </div>
      </div>

      <div style={{ marginTop: 18 }}>
        <Label T={T}>Split by discipline</Label>
        <div style={{ marginTop: 6 }}>
          {rows.length === 0
            ? <div style={{ fontSize: 13, color: T.body, padding: "10px 0" }}>No sessions logged yet.</div>
            : rows.map((d) => {
                const pct = Math.round((d.count / sessions.length) * 100);
                return (
                  <div key={d.key} style={{ padding: "9px 0", borderBottom: `1px solid ${T.rule}` }}>
                    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
                      <span style={{ font: "600 13px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>{d.label}</span>
                      <span className="fl-mono" style={{ fontSize: 12, color: T.muted }}>{pct}%</span>
                    </div>
                    <div style={{ height: 6, background: T.rule, marginTop: 9 }}><div style={{ height: 6, width: `${pct}%`, background: T.fg }} /></div>
                  </div>
                );
              })}
        </div>
      </div>

      <div style={{ marginTop: 22, paddingTop: 16, borderTop: `1px solid ${T.rule}` }}>
        <FightRecordSection T={T} fights={fights} addFight={addFight} deleteFight={deleteFight} />
      </div>

      <div style={{ marginTop: 22, paddingTop: 16, borderTop: `1px solid ${T.rule}` }}>
        <PRsSection T={T} prs={prs} addPR={addPR} deletePR={deletePR} />
      </div>

      <div style={{ marginTop: 14 }}>
        <BodyweightSection T={T} bodyweight={bodyweight} addBodyweight={addBodyweight} deleteBodyweight={deleteBodyweight} />
      </div>

      <div style={{ marginTop: 22, paddingTop: 16, borderTop: `1px solid ${T.rule}` }}>
        <div style={{ font: "600 15px/1 Archivo, sans-serif", textTransform: "uppercase", color: T.fg }}>Backup</div>
        <div style={{ fontSize: 12, lineHeight: 1.4, color: T.body, marginTop: 8, textWrap: "pretty" }}>
          Your data lives on this device only. Export a file regularly or move it to another phone.
        </div>
        <div style={{ display: "flex", gap: 7, marginTop: 12 }}>
          <Ghost T={T} onClick={doExport}><Icon name="down" size={16} /> Export</Ghost>
          <label style={{
            flex: 1, border: `1px solid ${T.fg}`, color: T.fg, height: 52, display: "flex", alignItems: "center",
            justifyContent: "center", gap: 8, font: "600 12px/1 Archivo, sans-serif", letterSpacing: "0.12em", textTransform: "uppercase"
          }}>
            <Icon name="up" size={16} /> Import
            <input type="file" accept="application/json" onChange={onFile} style={{ display: "none" }} />
          </label>
        </div>
        {error && <div style={{ fontSize: 12, color: T.accent, marginTop: 12 }}>{error}</div>}
        {pending && (
          <div style={{ marginTop: 14, border: `1px solid ${T.fg}`, padding: 14 }}>
            <div style={{ fontSize: 14, color: T.fg }}>
              Found: {(pending.sessions || []).length} sessions, {(pending.events || []).length} events, {(pending.plans || []).length} plans
            </div>
            <div style={{ fontSize: 12, color: T.body, marginTop: 8 }}>Importing replaces everything on this device.</div>
            <div style={{ display: "flex", gap: 7, marginTop: 12 }}>
              <Ghost T={T} onClick={() => setPending(null)}>Cancel</Ghost>
              <div style={{ flex: 1 }}><button onClick={() => {
                onImport({
                  sessions: Array.isArray(pending.sessions) ? pending.sessions : [],
                  events: Array.isArray(pending.events) ? pending.events : [],
                  plans: Array.isArray(pending.plans) ? pending.plans : [],
                  prs: Array.isArray(pending.prs) ? pending.prs : [],
                  fights: Array.isArray(pending.fights) ? pending.fights : [],
                  bodyweight: Array.isArray(pending.bodyweight) ? pending.bodyweight : []
                });
                setPending(null);
              }} style={{ width: "100%", height: 52, background: T.fg, color: T.bg, border: "none", borderRadius: 0, font: "600 12px/1 Archivo, sans-serif", letterSpacing: "0.12em", textTransform: "uppercase" }}>Replace</button></div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- app ---------- */
const TABS = [
  { key: "log", label: "LOG", icon: "log" },
  { key: "calendar", label: "CAL", icon: "cal" },
  { key: "strength", label: "S&C", icon: "dumbbell" },
  { key: "stats", label: "STATS", icon: "chart" }
];
const TITLES = { log: "Fight Log", calendar: "Calendar", strength: "Strength & cond.", stats: "Statistics" };
const SUBTITLES = { log: "TRAINING RECORD", calendar: "SCHEDULE", strength: "PLAN GENERATOR", stats: "LAST 8 WEEKS" };

function App() {
  const [tab, setTab] = useState("log");
  const [theme, setTheme] = useState("light");
  const [loading, setLoading] = useState(true);
  const [sessions, setSessions] = useState([]);
  const [events, setEvents] = useState([]);
  const [plans, setPlans] = useState([]);
  const [prs, setPrs] = useState([]);
  const [fights, setFights] = useState([]);
  const [bodyweight, setBodyweight] = useState([]);
  const T = THEMES[theme] || THEMES.light;

  useEffect(() => {
    let on = true;
    const loadKey = (key, setter, raw) => window.storage.get(key)
      .then((r) => { if (on && r && r.value) setter(raw ? r.value : JSON.parse(r.value)); })
      .catch(() => {});
    Promise.all([
      loadKey("sessions", setSessions), loadKey("events", setEvents),
      loadKey("plans", setPlans), loadKey("prs", setPrs), loadKey("fights", setFights),
      loadKey("bodyweight", setBodyweight),
      loadKey("theme", (v) => setTheme(v === "dark" ? "dark" : "light"), true)
    ]).finally(() => { if (on) setLoading(false); });
    return () => { on = false; };
  }, []);

  useEffect(() => {
    document.body.classList.toggle("fl-dark", theme === "dark");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", T.bg);
  }, [theme, T.bg]);

  const persist = useCallback((key, value, setter) => {
    setter(value);
    window.storage.set(key, JSON.stringify(value)).catch(() => {});
  }, []);
  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    window.storage.set("theme", next).catch(() => {});
  };

  const touchRef = useRef(null);
  const onTouchStart = (e) => {
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY, onScroller: !!(e.target.closest && e.target.closest(".fl-scroll-x")) };
  };
  const onTouchEnd = (e) => {
    if (!touchRef.current || touchRef.current.onScroller) { touchRef.current = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    touchRef.current = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = TABS.findIndex((tb) => tb.key === tab);
    if (dx < 0 && idx < TABS.length - 1) setTab(TABS[idx + 1].key);
    else if (dx > 0 && idx > 0) setTab(TABS[idx - 1].key);
  };

  const addSession = (s) => {
    persist("sessions", [s, ...sessions], setSessions);
    persist("events", [{
      id: uid(), date: s.date, type: "training", title: getDiscipline(s.discipline).label,
      time: "", location: "", notes: "", createdAt: Date.now(), sourceSessionId: s.id
    }, ...events], setEvents);
  };
  const deleteSession = (id) => {
    persist("sessions", sessions.filter((s) => s.id !== id), setSessions);
    persist("events", events.filter((e) => e.sourceSessionId !== id), setEvents);
  };
  const addEvent = (e) => persist("events", [e, ...events], setEvents);
  const deleteEvent = (id) => persist("events", events.filter((e) => e.id !== id), setEvents);
  const addPlan = (p) => persist("plans", [p, ...plans], setPlans);
  const addPlans = (ps) => persist("plans", [...ps, ...plans], setPlans);
  const deletePlan = (id) => persist("plans", plans.filter((p) => p.id !== id), setPlans);
  const addPR = (p) => persist("prs", [p, ...prs], setPrs);
  const deletePR = (id) => persist("prs", prs.filter((p) => p.id !== id), setPrs);
  const addFight = (f) => persist("fights", [f, ...fights], setFights);
  const deleteFight = (id) => persist("fights", fights.filter((f) => f.id !== id), setFights);
  const addBodyweight = (e) => persist("bodyweight", [e, ...bodyweight], setBodyweight);
  const deleteBodyweight = (id) => persist("bodyweight", bodyweight.filter((e) => e.id !== id), setBodyweight);
  const importAll = (d) => {
    persist("sessions", d.sessions, setSessions); persist("events", d.events, setEvents); persist("plans", d.plans, setPlans);
    persist("prs", d.prs || [], setPrs); persist("fights", d.fights || [], setFights);
    persist("bodyweight", d.bodyweight || [], setBodyweight);
  };

  return (
    <div className="fl-root" style={{ background: T.bg, color: T.fg, minHeight: "100vh" }}>
      <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", display: "flex", flexDirection: "column" }}>
        <header style={{
          padding: "calc(env(safe-area-inset-top) + 34px) 20px 14px", borderBottom: `2px solid ${T.fg}`,
          display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 12
        }}>
          <div>
            <div style={{ font: "700 30px/0.9 Archivo, sans-serif", letterSpacing: "-0.03em", textTransform: "uppercase" }}>{TITLES[tab]}</div>
            <div className="fl-mono" style={{ fontSize: 10, letterSpacing: "0.18em", color: T.muted, marginTop: 8 }}>{SUBTITLES[tab]}</div>
          </div>
          <button onClick={toggleTheme} className="fl-mono" style={{
            border: `1px solid ${T.fg}`, background: "transparent", color: T.fg, borderRadius: 0,
            fontSize: 10, letterSpacing: "0.14em", padding: "9px 11px"
          }}>{theme === "dark" ? "DARK" : "LIGHT"}</button>
        </header>

        <main style={{ flex: 1, padding: "0 20px 28px" }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          {loading ? (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12, padding: "90px 0", color: T.muted }}>
              <span className="icon-spin" style={{ display: "block" }}><Icon name="loader" size={22} /></span>
              <span className="fl-mono" style={{ fontSize: 10, letterSpacing: "0.16em" }}>LOADING</span>
            </div>
          ) : (
            <div style={{ marginTop: tab === "log" ? 0 : 10 }}>
              {tab === "log" && <LogView T={T} sessions={sessions} addSession={addSession} deleteSession={deleteSession} plans={plans} />}
              {tab === "calendar" && <CalendarView T={T} events={events} addEvent={addEvent} deleteEvent={deleteEvent} />}
              {tab === "strength" && <StrengthView T={T} plans={plans} addPlan={addPlan} addPlans={addPlans} deletePlan={deletePlan} />}
              {tab === "stats" && <StatsView T={T} sessions={sessions} events={events} plans={plans} prs={prs} addPR={addPR} deletePR={deletePR} fights={fights} addFight={addFight} deleteFight={deleteFight} bodyweight={bodyweight} addBodyweight={addBodyweight} deleteBodyweight={deleteBodyweight} onImport={importAll} />}
            </div>
          )}
        </main>

        <nav style={{
          position: "sticky", bottom: 0, display: "grid", gridTemplateColumns: "repeat(4,1fr)",
          borderTop: `2px solid ${T.fg}`, background: T.bg, paddingBottom: "env(safe-area-inset-bottom)"
        }}>
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} style={{
                background: active ? T.fg : "transparent", color: active ? T.bg : T.muted, border: "none", borderRadius: 0,
                padding: "14px 0 12px", display: "flex", flexDirection: "column", alignItems: "center", gap: 7
              }}>
                <Icon name={t.icon} size={18} />
                <span className="fl-mono" style={{ fontSize: 9, letterSpacing: "0.1em" }}>{t.label}</span>
              </button>
            );
          })}
        </nav>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
