<script>
  window.storage = {
    get: function (key) {
      return new Promise(function (resolve, reject) {
        try {
          var v = localStorage.getItem("fl:" + key);
          if (v === null) { reject(new Error("not found")); return; }
          resolve({ key: key, value: v, shared: false });
        } catch (e) { reject(e); }
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve, reject) {
        try { localStorage.setItem("fl:" + key, value); resolve({ key: key, value: value, shared: false }); }
        catch (e) { reject(e); }
      });
    },
    delete: function (key) {
      return new Promise(function (resolve) { localStorage.removeItem("fl:" + key); resolve({ key: key, deleted: true, shared: false }); });
    },
    list: function (prefix) {
      prefix = prefix || "";
      return new Promise(function (resolve) {
        var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf("fl:" + prefix) === 0; }).map(function (k) { return k.slice(3); });
        resolve({ keys: keys, prefix: prefix, shared: false });
      });
    }
  };
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
  }
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

    swords: <><line x1="5" y1="5" x2="19" y2="19"/><line x1="5" y1="19" x2="19" y2="5"/><line x1="9" y1="15" x2="15" y2="9"/></>,
    chart: <><line x1="4" y1="20" x2="4" y2="11"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></>,
    download: <><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></>,
    upload: <><path d="M12 21V9"/><polyline points="7 14 12 9 17 14"/><path d="M5 3h14"/></>,
    alertTriangle: <><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
  };
  return <svg {...common}>{paths[name] || null}</svg>;
}

const C = { paper: "#ffffff", obsidian: "#000000", inkstone: "#181818", feltGray: "#6d6d6d", slatePill: "#636363", ashMist: "#9a9a9a", pewter: "#808080", hairline: "rgba(0,0,0,0.14)" };
const IRIDESCENT = "linear-gradient(90deg, rgb(160,224,171), rgb(255,172,46) 50%, rgb(165,45,37))";
const EASE = "cubic-bezier(0.19,1,0.22,1)";
function textOn(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.55 ? C.obsidian : C.paper;
}

const GOALS = [{ key: "strength", label: "Kraft" }, { key: "power", label: "Explosivkraft" }, { key: "conditioning", label: "Ausdauer" }, { key: "mma", label: "MMA-spezifisch" }];

    { name: "Broad Jumps", sets: 4, reps: "5" }, { name: "Sprints", sets: 6, reps: "20 m" },
    { name: "Plyo Liegestütz", sets: 3, reps: "8" }, { name: "Battle Rope Slams", sets: 4, reps: "20 Sek" },
  ],

    { name: "Schlittenschieben", sets: 6, reps: "20 m" }, { name: "Seilspringen Runde", sets: 5, reps: "3 Min" },

  ],

    { name: "Explosive Med-Ball Sprawls", sets: 4, reps: "10" }, { name: "Power Clean", sets: 4, reps: "3" },

  ],
};

function shuffleArr(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function pick(pool, n) { return shuffleArr(pool).slice(0, Math.min(n, pool.length)); }
function generatePlan(goal, duration) {
  const count = duration <= 30 ? 3 : duration <= 45 ? 4 : duration <= 60 ? 6 : 8;
  let exercises = [];
  let warmup = POOLS.warmupStrength;
  if (goal === "strength") exercises = pick(POOLS.strength, count);
  else if (goal === "power") exercises = pick(POOLS.power, count);
  else if (goal === "conditioning") { exercises = pick(POOLS.conditioning, count); warmup = POOLS.warmupCond; }
  else if (goal === "mma") exercises = pick([...POOLS.mmaSpecific, ...POOLS.power], count);
  return { warmup, exercises };
}

function toISO(d) { const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, "0"); const day = String(d.getDate()).padStart(2, "0"); return `${y}-${m}-${day}`; }
function todayISO() { return toISO(new Date()); }
function fmtShort(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }); }
function fmtLong(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "long" }); }
function startOfWeekISO() { const d = new Date(); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return toISO(d); }
function startOfWeekDate(d) { const day = (d.getDay() + 6) % 7; const s = new Date(d); s.setDate(d.getDate() - day); s.setHours(0, 0, 0, 0); return s; }
function buildLastNWeeks(n) {
  const curStart = startOfWeekDate(new Date());
  const weeks = [];
  for (let i = n - 1; i >= 0; i--) {
    const start = new Date(curStart); start.setDate(curStart.getDate() - i * 7);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    weeks.push({ startISO: toISO(start), endISO: toISO(end), label: start.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) });
  }
  return weeks;
}
function getMonthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startDay = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) cells.push({ date: new Date(year, month - 1, daysInPrevMonth - i), current: false });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ date: new Date(year, month, d), current: true });
  while (cells.length % 7 !== 0) { const last = cells[cells.length - 1].date; const next = new Date(last); next.setDate(last.getDate() + 1); cells.push({ date: next, current: false }); }
  return cells;
}
const WEEKDAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function IconBtn({ onClick, children, title }) {
  return <button onClick={onClick} title={title} className="flex items-center justify-center" style={{ width: 38, height: 38, borderRadius: 9999, border: `1px solid ${C.obsidian}`, background: "transparent", color: C.obsidian }}>{children}</button>;
}
function Chip({ active, color, onClick, children }) {
  return <button onClick={onClick} className="text-xs" style={{ borderRadius: 9999, padding: "8px 16px", fontWeight: 400, background: active ? color : "transparent", color: active ? textOn(color) : C.feltGray, border: `1px solid ${active ? color : C.hairline}`, transition: `all .3s ${EASE}` }}>{children}</button>;
}
function Field({ label, children }) {
  return <label className="block"><span className="mb-2 block text-[11px] uppercase tracking-wide" style={{ color: C.feltGray }}>{label}</span>{children}</label>;
}
const inputStyle = { background: C.paper, border: "1px solid rgba(0,0,0,0.35)", color: C.obsidian, borderRadius: 0 };
const inputClass = "w-full px-3 py-2.5 text-sm outline-none";
function TextInput(props) { return <input {...props} style={inputStyle} className={inputClass + " " + (props.className || "")} />; }
function TextArea(props) { return <textarea {...props} style={inputStyle} className={inputClass + " " + (props.className || "")} />; }
function PrimaryButton({ onClick, children, disabled, type = "button" }) {
  return <button type={type} onClick={onClick} disabled={disabled} className="flex w-full items-center justify-center gap-2 text-sm disabled:opacity-40" style={{ background: C.slatePill, color: C.paper, border: `1px solid ${C.paper}`, borderRadius: 9999, padding: "12px 28px", fontWeight: 400 }}>{children}</button>;
}
function GhostButton({ onClick, children }) {
  return <button onClick={onClick} className="flex items-center justify-center gap-2 text-sm" style={{ background: "transparent", color: C.obsidian, border: `1px solid ${C.obsidian}`, borderRadius: 9999, padding: "12px 28px", fontWeight: 400 }}>{children}</button>;
}
function TextLink({ onClick, children }) { return <button onClick={onClick} className="text-xs" style={{ color: C.feltGray, fontWeight: 400 }}>{children}</button>; }
function EmptyState({ title, body }) {
  return <div className="px-5 py-10 text-left" style={{ border: `1px solid ${C.hairline}` }}><p className="fl-heading text-lg" style={{ color: C.obsidian, fontWeight: 400 }}>{title}</p><p className="mt-1 text-sm" style={{ color: C.feltGray }}>{body}</p></div>;
}
function IntensityDots({ value, onChange }) {
  return <div className="flex items-center gap-1.5">{[1, 2, 3, 4, 5].map((n) => <button key={n} type="button" onClick={() => onChange(n)} style={{ width: 22, height: 8, background: n <= value ? C.obsidian : "transparent", border: `1px solid ${n <= value ? C.obsidian : C.ashMist}` }} />)}</div>;
}
function IntensityDotsStatic({ value }) {
  return <div className="flex items-center gap-1">{[1, 2, 3, 4, 5].map((n) => <span key={n} style={{ width: 14, height: 5, background: n <= value ? C.obsidian : "transparent", border: `1px solid ${n <= value ? C.obsidian : C.ashMist}` }} />)}</div>;
}

function SessionForm({ onSave, onCancel }) {
  const [discipline, setDiscipline] = useState("mma");
  const [date, setDate] = useState(todayISO());
  const [duration, setDuration] = useState(60);
  const [intensity, setIntensity] = useState(3);
  const [didWell, setDidWell] = useState("");
  const [toImprove, setToImprove] = useState("");
  const [notes, setNotes] = useState("");
  const submit = () => onSave({ id: uid(), discipline, date, duration: Number(duration) || 0, intensity, didWell: didWell.trim(), toImprove: toImprove.trim(), notes: notes.trim(), createdAt: Date.now() });
  return (
    <div className="space-y-5 p-5" style={{ border: `1px solid ${C.obsidian}` }}>
      <div className="flex items-center justify-between">
        <p className="fl-heading text-lg" style={{ color: C.obsidian, fontWeight: 400 }}>Neuer Eintrag</p>
        <button onClick={onCancel}><Icon name="x" size={18} color={C.feltGray} /></button>
      </div>
      <Field label="Disziplin"><div className="flex flex-wrap gap-2">{DISCIPLINES.map((d) => <Chip key={d.key} active={discipline === d.key} color={d.color} onClick={() => setDiscipline(d.key)}>{d.label}</Chip>)}</div></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Datum"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Dauer (Min)"><TextInput type="number" min="0" value={duration} onChange={(e) => setDuration(e.target.value)} /></Field>
      </div>
      <Field label="Intensität"><IntensityDots value={intensity} onChange={setIntensity} /></Field>
      <Field label="Was wurde gemacht (Techniken / Drills)"><TextArea rows={2} placeholder="z.B. Leg Kick Kombinationen, Sparring 5 Runden, Takedown-Ketten" value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
      <Field label="Was ist gut gelaufen"><TextArea rows={2} placeholder="Was hat funktioniert?" value={didWell} onChange={(e) => setDidWell(e.target.value)} /></Field>
      <Field label="Was verbessert werden muss"><TextArea rows={2} placeholder="Woran musst du arbeiten?" value={toImprove} onChange={(e) => setToImprove(e.target.value)} /></Field>
      <PrimaryButton onClick={submit}><Icon name="save" size={16} /> Eintrag speichern</PrimaryButton>
    </div>
  );
}

function SessionCard({ session, onDelete }) {
  const [open, setOpen] = useState(false);
  const disc = getDiscipline(session.discipline);

          <div className="flex items-center justify-between">
            <span className="text-[11px] uppercase tracking-wide" style={{ color: disc.color === C.ashMist ? C.feltGray : disc.color }}>{disc.label}</span>

            <IntensityDotsStatic value={session.intensity} />
            {session.didWell && <p className="truncate text-sm" style={{ color: C.obsidian }}>{session.didWell}</p>}

        </button>
      </div>
      {open && (
        <div className="space-y-3 px-4 pb-5 pt-1 text-sm" style={{ color: C.obsidian }}>
          {session.notes && <div><p className="text-[11px] uppercase tracking-wide" style={{ color: C.feltGray }}>Was gemacht wurde</p><p className="mt-0.5">{session.notes}</p></div>}
          {session.didWell && <div><p className="text-[11px] uppercase tracking-wide" style={{ color: C.feltGray }}>Lief gut</p><p className="mt-0.5">{session.didWell}</p></div>}
          {session.toImprove && <div><p className="text-[11px] uppercase tracking-wide" style={{ color: C.feltGray }}>Verbessern</p><p className="mt-0.5">{session.toImprove}</p></div>}

}

function LogView({ sessions, addSession, deleteSession }) {
  const [showForm, setShowForm] = useState(false);
  const [filter, setFilter] = useState("all");
  const filtered = useMemo(() => { const list = filter === "all" ? sessions : sessions.filter((s) => s.discipline === filter); return [...list].sort((a, b) => (a.date < b.date ? 1 : -1) || b.createdAt - a.createdAt); }, [sessions, filter]);
  const stats = useMemo(() => {
    const weekStart = startOfWeekISO();
    const thisWeek = sessions.filter((s) => s.date >= weekStart).length;
    const counts = {};
    sessions.forEach((s) => (counts[s.discipline] = (counts[s.discipline] || 0) + 1));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    return { total: sessions.length, week: thisWeek, top: top ? getDiscipline(top[0]).label : "–" };
  }, [sessions]);
  return (
    <div className="space-y-6 pb-6">
      <div className="grid grid-cols-3" style={{ border: `1px solid ${C.hairline}` }}>
        {[{ label: "Gesamt", value: stats.total }, { label: "Diese Woche", value: stats.week }, { label: "Top", value: stats.top, small: true }].map((s, i) => (
          <div key={s.label} className="p-3 text-left" style={{ borderLeft: i > 0 ? `1px solid ${C.hairline}` : "none" }}>
            <p className={"fl-mono " + (s.small ? "text-sm" : "text-xl")} style={{ color: C.obsidian }}>{s.value}</p>
            <p className="text-[10px] uppercase tracking-wide" style={{ color: C.feltGray }}>{s.label}</p>

function WeeklyVolumeChart({ sessions }) {
  const weeks = useMemo(() => buildLastNWeeks(8).map((w) => ({ ...w, minutes: sessions.filter((s) => s.date >= w.startISO && s.date <= w.endISO).reduce((sum, s) => sum + (Number(s.duration) || 0), 0) })), [sessions]);
  const max = Math.max(...weeks.map((w) => w.minutes), 1);
  const MAX_H = 88;
  return (
    <div className="p-5" style={{ border: `1px solid ${C.hairline}` }}>
      <p className="fl-heading mb-5 text-lg" style={{ color: C.obsidian, fontWeight: 400 }}>Trainingsvolumen · letzte 8 Wochen</p>
      <div className="flex items-end gap-2" style={{ height: MAX_H + 34 }}>
        {weeks.map((w, i) => {
          const h = w.minutes > 0 ? Math.max(3, Math.round((w.minutes / max) * MAX_H)) : 3;
          return (
            <div key={i} className="flex flex-1 flex-col items-center justify-end gap-1.5">
              <span className="fl-mono text-[9px]" style={{ color: C.feltGray }}>{w.minutes > 0 ? w.minutes : ""}</span>
              <div style={{ width: "60%", maxWidth: 20, height: h, background: w.minutes > 0 ? C.obsidian : C.ashMist }} />
              <span className="fl-mono text-[9px]" style={{ color: C.feltGray }}>{w.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}
function DisciplineDistribution({ sessions }) {

function BackupSection({ sessions, events, plans, onImport }) {
  const [pending, setPending] = useState(null);
  const [error, setError] = useState("");
  const doExport = () => {
    const payload = { app: "fight-log", version: 1, exportedAt: new Date().toISOString(), sessions, events, plans };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `fight-log-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const onFile = (e) => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    setError("");
    const reader = new FileReader();
    reader.onload = () => { try { const data = JSON.parse(reader.result); if (!data || typeof data !== "object") throw new Error("invalid"); setPending(data); } catch (err) { setError("Datei konnte nicht gelesen werden. Ist es eine gültige Backup-Datei?"); } };
    reader.readAsText(file);
  };
  const confirmImport = () => { onImport({ sessions: Array.isArray(pending.sessions) ? pending.sessions : [], events: Array.isArray(pending.events) ? pending.events : [], plans: Array.isArray(pending.plans) ? pending.plans : [] }); setPending(null); };
  return (
    <div className="p-5" style={{ border: `1px solid ${C.hairline}` }}>
      <p className="fl-heading mb-1 text-lg" style={{ color: C.obsidian, fontWeight: 400 }}>Datensicherung</p>
      <p className="mb-5 text-xs" style={{ color: C.feltGray }}>Deine Daten liegen nur auf diesem Gerät. Exportiere regelmäßig ein Backup oder übertrage es auf ein anderes Handy.</p>
      <div className="flex gap-2">
        <GhostButton onClick={doExport}><Icon name="download" size={16} /> Exportieren</GhostButton>
        <label className="flex flex-1 cursor-pointer items-center justify-center gap-2 text-sm" style={{ background: "transparent", color: C.obsidian, border: `1px solid ${C.obsidian}`, borderRadius: 9999, padding: "12px 20px", fontWeight: 400 }}>
          <Icon name="upload" size={16} /> Importieren
          <input type="file" accept="application/json" onChange={onFile} className="hidden" />
        </label>
      </div>
      {error && <p className="mt-4 flex items-center gap-1.5 text-xs" style={{ color: C.obsidian }}><Icon name="alertTriangle" size={14} /> {error}</p>}
      {pending && (
        <div className="mt-4 space-y-3 p-4" style={{ border: `1px solid ${C.obsidian}` }}>
          <p className="text-sm" style={{ color: C.obsidian, fontWeight: 400 }}>Gefunden: {Array.isArray(pending.sessions) ? pending.sessions.length : 0} Trainings, {Array.isArray(pending.events) ? pending.events.length : 0} Termine, {Array.isArray(pending.plans) ? pending.plans.length : 0} Pläne</p>
          <p className="text-xs" style={{ color: C.feltGray }}>Der Import ersetzt alle aktuellen Daten auf diesem Gerät unwiderruflich.</p>
          <div className="flex gap-2"><GhostButton onClick={() => setPending(null)}>Abbrechen</GhostButton><PrimaryButton onClick={confirmImport}>Ersetzen &amp; importieren</PrimaryButton></div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("log");
  const [loading, setLoading] = useState(true);
  const [sessions, setSessions] = useState([]);
  const [events, setEvents] = useState([]);
  const [plans, setPlans] = useState([]);

  useEffect(() => {
    let mounted = true;
    async function loadKey(key, setter) {
      try { const res = await window.storage.get(key); if (mounted && res && res.value) setter(JSON.parse(res.value)); }
      catch (e) {}
    }
    Promise.all([loadKey("sessions", setSessions), loadKey("events", setEvents), loadKey("plans", setPlans)]).finally(() => { if (mounted) setLoading(false); });
    return () => { mounted = false; };
  }, []);

  const persist = useCallback(async (key, value, setter) => {
    setter(value);
    try { await window.storage.set(key, JSON.stringify(value)); } catch (e) { console.error("storage error", e); }
  }, []);

  const addSession = (s) => persist("sessions", [s, ...sessions], setSessions);
  const deleteSession = (id) => persist("sessions", sessions.filter((s) => s.id !== id), setSessions);
  const addEvent = (e) => persist("events", [e, ...events], setEvents);
  const deleteEvent = (id) => persist("events", events.filter((e) => e.id !== id), setEvents);
  const addPlan = (p) => persist("plans", [p, ...plans], setPlans);
  const deletePlan = (id) => persist("plans", plans.filter((p) => p.id !== id), setPlans);

          <div className="flex h-9 w-9 items-center justify-center" style={{ border: `1px solid ${C.paper}`, borderRadius: 9999 }}><Icon name="swords" size={16} color={C.paper} /></div>

            <>
              {tab === "log" && <LogView sessions={sessions} addSession={addSession} deleteSession={deleteSession} />}
              {tab === "calendar" && <CalendarView events={events} addEvent={addEvent} deleteEvent={deleteEvent} />}
              {tab === "strength" && <StrengthView plans={plans} addPlan={addPlan} deletePlan={deletePlan} />}
              {tab === "stats" && <StatsView sessions={sessions} events={events} plans={plans} onImport={importAll} />}
            </>
          )}
        </main>
        <nav className="sticky bottom-0 z-10 mt-6 grid grid-cols-4 gap-1 px-3 py-3" style={{ background: C.obsidian }}>
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex flex-col items-center gap-1.5 py-1.5" style={{ color: active ? C.paper : C.ashMist }}>
                <Icon name={t.icon} size={19} />
                <span className="text-[9px] uppercase tracking-wide" style={{ fontWeight: active ? 600 : 400 }}>{t.label}</span>
              </button>
            );
          })}
        </nav>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
